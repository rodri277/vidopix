name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Format
        run: pnpm format:check

      - name: Lint and architecture boundaries
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, property, component and boundary tests
        run: pnpm test

      - name: Benchmarks (report only)
        run: pnpm bench

      - name: Build
        run: pnpm build

      - name: Bundle size
        run: pnpm size

      - name: Install Playwright browser
        run: pnpm --filter @vidopix/web exec playwright install --with-deps chromium

      - name: E2E and accessibility
        run: pnpm e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: packages/core/coverage
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
